<title>حصن الوطن | المفاتيح الثلاثة</title>
<style>
:root{--g:#102F28;--iv:#F5EEDC;--au:#D4AF66;--cu:#A87C46;--q:clamp(36px,3.2vw,44px);--o:clamp(30px,2.6vw,36px);--m:clamp(28px,2.4vw,32px)}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--g);color:var(--iv);font-family:"Noto Naskh Arabic","Segoe UI","Geeza Pro",Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--au);outline-offset:2px}
#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 35%,#18463b,var(--g) 70%)}
#top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;z-index:3}
.t{font-size:clamp(22px,2.4vw,30px);font-weight:700;color:var(--au)}
#ind{font-size:clamp(22px,2.2vw,28px);padding:2px 18px;border:1.5px solid var(--au);border-radius:99px;background:rgba(16,47,40,.75)}
.bts{display:flex;gap:8px}
.bt{font-size:20px;min-height:44px;padding:0 14px;border:1.5px solid var(--cu);border-radius:12px;background:rgba(16,47,40,.78)}
.gold{font-size:var(--o);font-weight:700;color:var(--g);background:linear-gradient(#ecce8a,var(--au));border:0;border-radius:16px;padding:.3em 1.6em;min-height:64px;box-shadow:0 0 22px rgba(212,175,102,.5)}
#stage{flex:1;min-height:0;position:relative}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.42))}
#sc{width:100%;height:100%;display:block}
.pane{display:none;flex:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
[data-s=intro] #pIntro,[data-s=q] #pQ,[data-s=end] #pEnd{display:flex}
#sub{font-size:var(--q);min-height:1.4em;font-weight:700}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
#q{font-size:var(--q);line-height:1.35;font-weight:700}
#opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:1400px;transition:opacity .45s,transform .45s}
#opts.out{opacity:0;transform:translateY(34px);pointer-events:none}
.opt{font-size:var(--o);line-height:1.25;min-height:clamp(64px,10vh,96px);padding:6px 14px;border:2px solid var(--au);border-radius:16px;background:rgba(245,238,220,.09);animation:in .45s both;transition:background .25s,box-shadow .25s,opacity .25s}
.opt:active{background:rgba(212,175,102,.3)}
.opt.good{background:var(--au);color:var(--g);font-weight:700;box-shadow:0 0 30px 6px rgba(212,175,102,.7)}
.opt.tried{opacity:.4}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
#msg{font-size:var(--m);min-height:1.35em;line-height:1.35;color:var(--au)}#msg.bad{color:var(--iv)}
.fin #q,.fin #opts{visibility:hidden}
.e1{font-size:var(--q);color:var(--au);font-weight:700}.e2{font-size:var(--q);font-weight:700}
.cover{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1d5244,#0b221c 75%)}
[data-s=cover] .cover{display:flex}
.cover h1{font-size:clamp(48px,14vh,72px);text-shadow:0 0 30px rgba(212,175,102,.5)}
.cover h2{font-size:clamp(28px,6vh,44px);color:var(--au);font-weight:400}
.cover i{width:min(320px,50vw);height:3px;background:linear-gradient(90deg,transparent,var(--au),transparent)}
.exp #top .t{display:none}.exp{gap:2px}
/* scene */
.fort{opacity:0;transition:opacity 2.2s ease}.rev .fort{opacity:1}.fast .fort{transition-duration:.4s}
#cam{transform-box:view-box;transform-origin:400px 270px;transition:transform 2.2s ease-in-out}.zoom #cam{transform:scale(1.14)}
.shade{opacity:.55;transition:opacity 1.3s}.lit .shade{opacity:0}
.win{fill:#16241e;transition:fill 1s}.lit .win{fill:var(--au);filter:drop-shadow(0 0 4px #D4AF66)}
.dl,.dr{transform-box:view-box;transition:transform 1.5s cubic-bezier(.5,0,.2,1)}.dl{transform-origin:320px 0}.dr{transform-origin:480px 0}
.open .dl,.open .dr{transform:scaleX(.13)}
.inner{opacity:0;transition:opacity 1.5s}.open .inner{opacity:1}
.lk .sh{transform-box:fill-box;transform-origin:100% 100%;transition:transform .5s}
.lk.open .sh{transform:translateY(-7px) rotate(-30deg)}
.lk .gl{opacity:0;transition:opacity .4s}.lk.glow .gl{opacity:.85;animation:pl 1s ease-in-out infinite alternate}.lk.open .gl{opacity:.5}
@keyframes pl{to{opacity:.4}}
#key{opacity:0;transition:opacity .6s;filter:drop-shadow(0 0 7px rgba(212,175,102,.9))}#key.show{opacity:1}
#kO,#kM{transform-box:view-box;transform-origin:0 0;transition-property:transform;transition-timing-function:ease-in-out}
.floating{animation:bob 2.6s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-7px)}}
.shake{animation:shk .42s}@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.pt{opacity:0}.end .pt{animation:rise 3.4s linear infinite}
@keyframes rise{0%{opacity:0;transform:translateY(18px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-90px)}}
@media (max-height:500px){
:root{--q:30px;--o:25px;--m:24px}
#top{position:absolute;top:max(6px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right))}
.bt{min-height:40px;font-size:20px}.opt{min-height:60px;padding:4px 8px}#opts{gap:8px}.gold{min-height:54px}.pane{gap:4px}
}
@media (max-width:600px){#opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.floating,.lk.glow .gl{animation:none}.pt{display:none}.fort,#cam,.dl,.dr,.inner,#opts{transition-duration:.01s!important}.opt{animation:none}}

.intro-content{display:flex;align-items:center;justify-content:center;gap:22px;width:100%;max-width:1350px;margin:auto}
.rawan-guide{flex:none;width:94px;display:flex;flex-direction:column;align-items:center;gap:3px}.rawan-medallion{position:relative;width:88px;height:88px;border:2px solid #D4AF66;border-radius:50%;overflow:hidden;background:radial-gradient(circle,#335447,#102F28);box-shadow:0 0 24px #D4AF6628}.rawan-medallion svg{display:block;width:100%;height:100%}.rawan-name{font-size:20px;color:var(--au)}
.voice-bars{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;height:18px;padding:2px 7px;background:#102F28ed;border-radius:10px;opacity:.4}.voice-bars i{width:3px;height:4px;background:#D4AF66;border-radius:3px}.voice-bars.speaking{opacity:1}.voice-bars.speaking i{animation:voiceBar .45s ease-in-out infinite alternate}.voice-bars.speaking i:nth-child(2){animation-delay:-.12s}.voice-bars.speaking i:nth-child(3){animation-delay:-.28s}.voice-bars.speaking i:nth-child(4){animation-delay:-.19s}@keyframes voiceBar{to{height:12px}}
#sub{flex:1;min-width:0;text-align:center;line-height:1.3}.opt.tried{opacity:1;border-color:#b8a17c;background:#3b4232}.exp .rawan-guide{display:flex}
@media(max-height:500px){.intro-content{gap:12px}.rawan-guide{width:68px}.rawan-medallion{width:60px;height:60px}.rawan-name{font-size:16px}.voice-bars{bottom:2px;height:15px;padding:1px 6px}#pIntro{padding-top:4px}#sub{font-size:28px}}
@media(prefers-reduced-motion:reduce){.voice-bars.speaking i,.shake{animation:none!important}#kO,#kM,.lk .sh,#key{transition-duration:0s!important}}
</style>

function tone(f,d,type='sine',v=.12,dl=0,f2){if(muted)return;try{const a=ac();if(!a)return;const t=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);act.add(o);o.onended=()=>{act.delete(o);o.disconnect();g.disconnect()};o.start(t);o.stop(t+d+.05)}catch(e){}}
const S={pick:()=>tone(660,.1,'sine',.1),ins:()=>{tone(2200,.07,'triangle',.12);tone(1500,.12,'square',.04,.03)},turn:()=>{for(let i=0;i<4;i++)tone(170+i*25,.09,'square',.05,i*.13)},open:()=>[523,659,784].forEach((f,i)=>tone(f,.45,'sine',.12,i*.1)),gate:()=>{tone(80,1.7,'sawtooth',.07,0,45);tone(150,1.4,'triangle',.05,.1)},wrong:()=>tone(240,.22,'sine',.09,0,200)};
function stopSnd(){act.forEach(o=>{try{o.stop();o.disconnect()}catch(e){}});act.clear();if(aud){aud.onended=null;aud.onplaying=null;aud.onpause=null;aud.ontimeupdate=null;aud.onerror=null;aud.pause();aud.currentTime=0;aud=null}$('#voiceBars').classList.remove('speaking')}
/* ===== المقدمة ===== */
function startIntro(){
 resetScene(false);setS('intro');$('#go').hidden=true;$('#skip').hidden=false;$('#voiceRetry').hidden=true;$('#sub').textContent='';sc.classList.remove('rev','fast');key.classList.remove('show');ac();
 const token=epoch;
 const events=C.intro.map(segment=>({t:segment.t,run:()=>$('#sub').textContent=segment.text}));
 events.push(
  {t:0,run:()=>sc.classList.add('rev')},
  {t:1955,run:()=>sc.classList.add('zoom')},
  ...[4500,5100,5700].map((t,i)=>({t,run:()=>$('#L'+i).classList.add('glow')})),
  {t:7849,run:()=>{lks().forEach(l=>l.classList.remove('glow'));key.classList.add('show');placeKey(400,300,0,0)}},
  {t:8150,run:()=>placeKey(350,285,-8,750)},
  {t:9250,run:()=>placeKey(450,285,8,750)},
  {t:11169,run:()=>{sc.classList.remove('zoom');placeKey(400,300,0,650);lks().forEach(l=>l.classList.add('glow'))}},
  {t:14280,run:()=>{$('#go').hidden=false}}
 );
 events.sort((a,b)=>a.t-b.t);let next=0,fallbackStarted=false;
 function advance(ms){if(token!==epoch||st!=='intro')return;while(next<events.length&&events[next].t<=ms)events[next++].run()}
 function textFallback(){if(token!==epoch||fallbackStarted)return;fallbackStarted=true;for(const event of events)after(event.t,()=>advance(event.t))}
 if(C.introAudio){
  aud=new Audio(C.introAudio);aud.muted=muted;
  const recording=aud;
  aud.onplaying=()=>{if(token===epoch&&!muted)$('#voiceBars').classList.add('speaking')};
  aud.onpause=()=>$('#voiceBars').classList.remove('speaking');
  aud.ontimeupdate=()=>{if(token===epoch&&aud===recording)advance(recording.currentTime*1000)};
  aud.onended=()=>{if(token!==epoch||aud!==recording)return;$('#voiceBars').classList.remove('speaking');advance(14736);$('#go').hidden=false};
  const failure=()=>{if(token!==epoch||st!=='intro')return;$('#voiceBars').classList.remove('speaking');$('#voiceRetry').hidden=false;textFallback()};
  aud.onerror=failure;
  const started=aud.play();
  if(started&&typeof started.then==='function')started.then(()=>advance(recording.currentTime*1000)).catch(failure);else advance(0);
 }else textFallback();
}

function beginQuiz(){resetScene(false);lks().forEach(l=>l.classList.remove('glow'));sc.classList.remove('zoom');sc.classList.add('rev');key.classList.add('show');placeKey(400,300,0,RM?0:500);idx=0;showQ()}

/* ===== الأسئلة ===== */
const say=(t,c)=>{msg.textContent=t;msg.className=c||''};
function showQ(){
 const q=C.questions[idx];app.classList.remove('fin');$('#q').textContent=q.q;say('');
 optsEl.className='';optsEl.innerHTML=ord[idx].map(o=>`<button class="opt" data-id="${o.id}">${o.text}</button>`).join('');
 $('#ind').textContent=`المفتاح ${AR[idx]} من ٣`;setS('q');kF.classList.add('floating');busy=false;
}
optsEl.addEventListener('click',e=>{
 const b=e.target.closest('.opt');if(!b||busy||st!=='q')return;busy=true;S.pick();
 const q=C.questions[idx];b.dataset.id===q.correct?good(b,q):bad(b,q);
});
function bad(b,q){
 b.classList.add('tried');b.disabled=true;say(q.bad,'bad');S.wrong();
 kF.classList.remove('floating');if(!RM)kF.classList.add('shake');
 after(450,()=>{kF.classList.remove('shake');kF.classList.add('floating');b.disabled=false;b.classList.remove('tried');busy=false});
}
function good(b,q){
 st='animating';const i=idx,[x,y]=KH[i];$$('.opt').forEach(el=>el.disabled=true);b.classList.add('good');say(q.ok,'ok');
 after(450,()=>optsEl.classList.add('out'));
 after(500,()=>{kF.classList.remove('floating');placeKey(x,y+18,0,600)});
 after(1150,()=>{placeKey(x,y,0,150);S.ins()});
 after(1350,()=>{placeKey(x,y,90,600);S.turn()});
 after(2050,()=>{$('#L'+i).classList.add('open');$('#P'+i).classList.add('lit');S.open()});
 after(2350,()=>placeKey(400,300,0,600));
 after(3000,()=>{if(i<2){idx++;showQ()}else finish()});
}
function finish(){
 st='animating';app.classList.add('fin');lks().forEach(l=>l.classList.add('glow'));
 after(900,()=>placeKey(400,322,0,500));
 after(1500,()=>{key.classList.remove('show');sc.classList.add('open');S.gate()});
 after(3300,()=>{sc.classList.add('end');lks().forEach(l=>l.classList.remove('glow'));setS('end')});
}
function resetScene(shuf){
 clr();stopSnd();idx=0;busy=false;sc.classList.remove('open','end','zoom');app.classList.remove('fin');
 lks().forEach(l=>l.classList.remove('open','glow'));$$('.part').forEach(p=>p.classList.remove('lit'));
 kF.classList.remove('shake');kF.classList.add('floating');placeKey(400,300,0,RM?0:500);key.classList.add('show');
 if(shuf)ord=C.questions.map(q=>[...q.options].sort(()=>Math.random()-.5));
}
/* ===== الأزرار ===== */
$('#start').onclick=startIntro;
$('#voiceRetry').onclick=()=>{if(muted)$('#bMute').onclick();startIntro()};
$('#skip').onclick=()=>{sc.classList.add('fast');beginQuiz()};
$('#go').onclick=beginQuiz;
$('#again').onclick=()=>{resetScene(true);showQ()};
$('#hear').onclick=()=>{resetScene(false);sc.classList.remove('rev');key.classList.remove('show');startIntro()};
$('#bMute').onclick=()=>{muted=!muted;$('#bMute').setAttribute('aria-pressed',String(muted));$('#bMute').textContent=muted?'تشغيل الصوت':'كتم الصوت';if(mg)mg.gain.value=muted?0:1;if(aud){aud.muted=muted;if(muted||aud.paused)$('#voiceBars').classList.remove('speaking');else $('#voiceBars').classList.add('speaking')}if(muted)act.forEach(o=>{try{o.stop()}catch(e){}})};
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function fsLabel(){$('#bFs').textContent=fsEl()?'الخروج من ملء الشاشة':app.classList.contains('exp')?'العودة':'ملء الشاشة'}
$('#bFs').onclick=async()=>{
 if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
 if(app.classList.contains('exp')){app.classList.remove('exp');fsLabel();return}
 const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;
 const alt=()=>{app.classList.add('exp');fsLabel()}; // عرض موسّع داخل نافذة المتصفح فقط
 if(!rq){alt();return}
 try{await rq.call(el)}catch(e){alt()}
};
['fullscreenchange','webkitfullscreenchange'].forEach(n=>document.addEventListener(n,fsLabel));
$('#e1').textContent=C.end[0];$('#e2').textContent=C.end[1];
</script>
