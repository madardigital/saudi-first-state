name: One-time Diriyah wording change
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-diriyah-wording.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Make the one-word correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          raw = path.read_bytes()
          before = "أشيري على الموضع اللي تتوقعين".encode("utf-8")
          after = "أشيري على الموضع الذي تتوقعين".encode("utf-8")
          assert raw.count(before) == 1, "Expected exactly one occurrence"
          path.write_bytes(raw.replace(before, after))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace اللي with الذي in Diriyah map instruction"
          git push
